<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeepleHouse - Inventário de Board Games</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #f4f1ea; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Banner Temático de Taberna */
        .tavern-banner {
            background: linear-gradient(135deg, #2b1810 0%, #3e2217 100%);
            border-bottom: 4px solid #d4af37;
            border-radius: 12px;
            color: #f4f1ea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .tavern-title {
            color: #f3e5ab;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card { 
            border-radius: 12px; 
            border: none; 
        }
        .card-header.bg-primary {
            background-color: #4a2e1b !important;
        }
        .card-header.bg-secondary {
            background-color: #2b1810 !important;
        }
        .badge-estado-Novo { background-color: #198754; }
        .badge-estado-Excelente { background-color: #0d6efd; }
        .badge-estado-Bom { background-color: #0dcaf0; color: #000; }
        .badge-estado-Desgastado { background-color: #ffc107; color: #000; }
        .btn-success {
            background-color: #5c3a21;
            border-color: #4a2e1b;
        }
        .btn-success:hover {
            background-color: #4a2e1b;
            border-color: #3e2217;
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <!-- Banner Estilo Taberna -->
        <div class="tavern-banner p-4 mb-4 d-flex flex-column flex-md-row justify-content-between align-items-center">
            <div class="mb-3 mb-md-0 text-center text-md-start">
                <h1 class="tavern-title h3 mb-1"><i class="fa-solid fa-chess-rook me-2"></i>MeepleHouse</h1>
                <p class="mb-0 text-light opacity-75 small">O refúgio oficial da tua coleção de jogos de tabuleiro</p>
            </div>
            <div class="bg-dark bg-opacity-50 px-4 py-2 rounded-pill border border-warning border-opacity-50 text-center">
                <span class="text-warning small text-uppercase fw-bold d-block">Jogos na Taberna</span>
                <h3 class="mb-0 text-white fw-bold" id="total-jogos">0</h3>
            </div>
        </div>

        <!-- Painel de Cadastro e Edição -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white py-3 fw-bold" id="form-title">
                <i class="fa-solid fa-circle-plus me-2"></i>Adicionar Novo Jogo
            </div>
            <div class="card-body p-4">
                <form id="jogo-form">
                    <input type="hidden" id="jogo-id">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="titulo" class="form-label text-secondary fw-semibold">Título</label>
                            <input type="text" class="form-control" id="titulo" required placeholder="Ex: Catan, Carcassonne...">
                        </div>
                        <div class="col-md-6">
                            <label for="editora" class="form-label text-secondary fw-semibold">Editora</label>
                            <input type="text" class="form-control" id="editora" required placeholder="Ex: Devir, Galápagos...">
                        </div>
                        <div class="col-md-4">
                            <label for="tempo" class="form-label text-secondary fw-semibold">Tempo de Partida (min)</label>
                            <input type="number" class="form-control" id="tempo" required placeholder="Ex: 60">
                        </div>
                        <div class="col-md-4">
                            <label for="jogadores" class="form-label text-secondary fw-semibold">Nº de Jogadores</label>
                            <input type="text" class="form-control" id="jogadores" required placeholder="Ex: 2-4">
                        </div>
                        <div class="col-md-4">
                            <label for="estado" class="form-label text-secondary fw-semibold">Estado de Conservação</label>
                            <select class="form-select" id="estado" required>
                                <option value="Novo">Novo</option>
                                <option value="Excelente">Excelente</option>
                                <option value="Bom">Bom</option>
                                <option value="Desgastado">Desgastado</option>
                            </select>
                        </div>
                        <div class="col-12 text-end pt-3">
                            <button type="button" id="btn-cancelar" class="btn btn-secondary me-2 d-none" onclick="cancelarEdicao()">Cancelar</button>
                            <button type="submit" class="btn btn-success px-4" id="btn-salvar"><i class="fa-solid fa-check me-2"></i>Salvar Jogo</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabela de Jogos -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white py-3 fw-bold">
                <i class="fa-solid fa-scroll me-2"></i>Acervo de Jogos
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light text-secondary">
                            <tr>
                                <th class="ps-4">Título</th>
                                <th>Editora</th>
                                <th>Tempo</th>
                                <th>Jogadores</th>
                                <th>Estado</th>
                                <th class="text-end pe-4">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-jogos">
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";

        async function carregarJogos() {
            try {
                const response = await fetch(`${API_URL}/jogos`);
                const jogos = await response.json();
                const tbody = document.getElementById("tabela-jogos");
                document.getElementById("total-jogos").innerText = jogos.length || 0;
                tbody.innerHTML = "";

                if (!Array.isArray(jogos) || jogos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">A taberna está vazia. Nenhum jogo cadastrado.</td></tr>`;
                    return;
                }

                jogos.forEach(jogo => {
                    const badgeClass = `badge-estado-${jogo.estado}` || 'bg-secondary';
                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-4"><strong>${jogo.titulo}</strong></td>
                            <td>${jogo.editora}</td>
                            <td><i class="fa-regular fa-clock me-1 text-muted"></i>${jogo.tempo} min</td>
                            <td><i class="fa-solid fa-users me-1 text-muted"></i>${jogo.jogadores}</td>
                            <td><span class="badge ${badgeClass} p-2">${jogo.estado}</span></td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick='prepararEdicao(${JSON.stringify(jogo)})'>
                                    <i class="fa-solid fa-pen me-1"></i>Editar
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="excluirJogo(${jogo.id})">
                                    <i class="fa-solid fa-trash me-1"></i>Excluir
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Erro ao carregar jogos:", error);
            }
        }

        document.getElementById("jogo-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const id = document.getElementById("jogo-id").value;
            const jogoData = {
                titulo: document.getElementById("titulo").value,
                editora: document.getElementById("editora").value,
                tempo: parseInt(document.getElementById("tempo").value),
                jogadores: document.getElementById("jogadores").value,
                estado: document.getElementById("estado").value
            };

            const url = id ? `${API_URL}/jogos/${id}` : `${API_URL}/jogos`;
            const method = id ? "PUT" : "POST";

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(jogoData)
                });

                if (response.ok) {
                    cancelarEdicao();
                    carregarJogos();
                } else {
                    alert("Erro ao salvar o jogo.");
                }
            } catch (error) {
                console.error("Erro:", error);
            }
        });

        function prepararEdicao(jogo) {
            document.getElementById("jogo-id").value = jogo.id;
            document.getElementById("titulo").value = jogo.titulo;
            document.getElementById("editora").value = jogo.editora;
            document.getElementById("tempo").value = jogo.tempo;
            document.getElementById("jogadores").value = jogo.jogadores;
            document.getElementById("estado").value = jogo.estado;

            document.getElementById("form-title").innerHTML = `<i class="fa-solid fa-pen-to-square me-2"></i>Editar Jogo (ID: ${jogo.id})`;
            document.getElementById("btn-salvar").innerHTML = `<i class="fa-solid fa-check me-2"></i>Atualizar Jogo`;
            document.getElementById("btn-cancelar").classList.remove("d-none");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicao() {
            document.getElementById("jogo-form").reset();
            document.getElementById("jogo-id").value = "";
            document.getElementById("form-title").innerHTML = `<i class="fa-solid fa-circle-plus me-2"></i>Adicionar Novo Jogo`;
            document.getElementById("btn-salvar").innerHTML = `<i class="fa-solid fa-check me-2"></i>Salvar Jogo`;
            document.getElementById("btn-cancelar").classList.add("d-none");
        }

        async function excluirJogo(id) {
            if (confirm("Tens a certeza que pretendes excluir este jogo?")) {
                try {
                    const response = __await_fetch_delete__(`${API_URL}/jogos/${id}`, { method: "DELETE" });
                    // code normal abaixo:
                    const resDel = await fetch(`${API_URL}/jogos/${id}`, { method: "DELETE" });
                    if (resDel.ok) {
                        carregarJogos();
                    } else {
                        alert("Erro ao excluir o jogo.");
                    }
                } catch (error) {
                    console.error("Erro:", error);
                }
            }
        }

        carregarJogos();
    </script>
</body>
</html>
