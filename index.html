<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeepleHouse - Inventário de Board Games</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <!-- Cabeçalho -->
        <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
            <h1 class="h3 mb-0 text-primary"><i class="fa-solid fa-dice me-2"></i>MeepleHouse - Inventário de Board Games</h1>
        </div>

        <!-- Formulário de Cadastro / Edição -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white" id="form-title">
                <i class="fa-solid fa-circle-plus me-2"></i>Adicionar Novo Jogo
            </div>
            <div class="card-body">
                <form id="jogo-form">
                    <input type="hidden" id="jogo-id">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="titulo" class="form-label">Título</label>
                            <input type="text" class="form-control" id="titulo" required placeholder="Ex: Catan, Carcassonne...">
                        </div>
                        <div class="col-md-6">
                            <label for="editora" class="form-label">Editora</label>
                            <input type="text" class="form-control" id="editora" required placeholder="Ex: Devir, Galápagos...">
                        </div>
                        <div class="col-md-4">
                            <label for="tempo" class="form-label">Tempo de Partida (min)</label>
                            <input type="number" class="form-control" id="tempo" required placeholder="Ex: 60">
                        </div>
                        <div class="col-md-4">
                            <label for="jogadores" class="form-label">Nº de Jogadores</label>
                            <input type="text" class="form-control" id="jogadores" required placeholder="Ex: 2-4">
                        </div>
                        <div class="col-md-4">
                            <label for="estado" class="form-label">Estado de Conservação</label>
                            <select class="form-select" id="estado" required>
                                <option value="Novo">Novo</option>
                                <option value="Excelente">Excelente</option>
                                <option value="Bom">Bom</option>
                                <option value="Desgastado">Desgastado</option>
                            </select>
                        </div>
                        <div class="col-12 text-end">
                            <button type="button" id="btn-cancelar" class="btn btn-secondary d-none me-2" onclick="cancelarEdicao()">Cancelar</button>
                            <button type="submit" class="btn btn-success" id="btn-salvar"><i class="fa-solid fa-check me-2"></i>Salvar Jogo</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabela de Listagem -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">
                <i class="fa-solid fa-box-archive me-2"></i>Lista de Jogos
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Título</th>
                                <th>Editora</th>
                                <th>Tempo</th>
                                <th>Jogadores</th>
                                <th>Estado</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-jogos">
                            <!-- Os jogos aparecem aqui dinamicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script JavaScript para consumo da API -->
    <script>
        const API_URL = "http://localhost:8000";

        async function carregarJogos() {
            try {
                const response = await fetch(`${API_URL}/jogos`);
                const jogos = await response.json();
                const tbody = document.getElementById("tabela-jogos");
                tbody.innerHTML = "";

                if (jogos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">Nenhum jogo cadastrado no acervo.</td></tr>`;
                    return;
                }

                jogos.forEach(jogo => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${jogo.titulo}</strong></td>
                            <td>${jogo.editora}</td>
                            <td><i class="fa-regular fa-clock me-1 text-muted"></i>${jogo.tempo} min</td>
                            <td><i class="fa-solid fa-users me-1 text-muted"></i>${jogo.jogadores}</td>
                            <td><span class="badge bg-info text-dark">${jogo.estado}</span></td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick='prepararEdicao(${JSON.stringify(jogo)})'>
                                    <i class="fa-solid fa-pen"></i> Editar
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="excluirJogo(${jogo.id})">
                                    <i class="fa-solid fa-trash"></i> Excluir
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Erro ao carregar jogos:", error);
            }
        }

        document.getElementById("jogo-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const id = document.getElementById("jogo-id").value;
            const jogoData = {
                titulo: document.getElementById("titulo").value,
                editora: document.getElementById("editora").value,
                tempo: parseInt(document.getElementById("tempo").value),
                jogadores: document.getElementById("jogadores").value,
                estado: document.getElementById("estado").value
            };

            const url = id ? `${API_URL}/jogos/${id}` : `${API_URL}/jogos`;
            const method = id ? "PUT" : "POST";

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(jogoData)
                });

                if (response.ok) {
                    cancelarEdicao();
                    carregarJogos();
                } else {
                    alert("Erro ao salvar o jogo.");
                }
            } catch (error) {
                console.error("Erro:", error);
            }
        });

        function prepararEdicao(jogo) {
            document.getElementById("jogo-id").value = jogo.id;
            document.getElementById("titulo").value = jogo.titulo;
            document.getElementById("editora").value = jogo.editora;
            document.getElementById("tempo").value = jogo.tempo;
            document.getElementById("jogadores").value = jogo.jogadores;
            document.getElementById("estado").value = jogo.estado;

            document.getElementById("form-title").innerHTML = `<i class="fa-solid fa-pen-to-square me-2"></i>Editar Jogo (ID: ${jogo.id})`;
            document.getElementById("btn-salvar").innerHTML = `<i class="fa-solid fa-check me-2"></i>Atualizar Jogo`;
            document.getElementById("btn-cancelar").classList.remove("d-none");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicao() {
            document.getElementById("jogo-form").reset();
            document.getElementById("jogo-id").value = "";
            document.getElementById("form-title").innerHTML = `<i class="fa-solid fa-circle-plus me-2"></i>Adicionar Novo Jogo`;
            document.getElementById("btn-salvar").innerHTML = `<i class="fa-solid fa-check me-2"></i>Salvar Jogo`;
            document.getElementById("btn-cancelar").classList.add("d-none");
        }

        async function excluirJogo(id) {
            if (confirm("Tens a certeza que pretendes excluir este jogo?")) {
                try {
                    const response = await fetch(`${API_URL}/jogos/${id}`, { method: "DELETE" });
                    if (response.ok) {
                        carregarJogos();
                    } else {
                        alert("Erro ao excluir o jogo.");
                    }
                } catch (error) {
                    console.error("Erro:", error);
                }
            }
        }

        carregarJogos();
    </script>
</body>
</html>
